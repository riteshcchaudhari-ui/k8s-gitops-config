apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyshop-web-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/riteshcchaudhari-ui/k8s-gitops-config.git
    targetRevision: main
    path: charts/easyshop-web
    helm:
      releaseName: easyshop-web
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
