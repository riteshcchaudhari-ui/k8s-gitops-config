apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/riteshcchaudhari-ui/k8s-gitops-config.git
    targetRevision: main
    path: charts/mongodb
    helm:
      releaseName: mongodb
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
