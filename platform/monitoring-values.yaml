# Installed with: helm upgrade --install monitoring prometheus-community/kube-prometheus-stack -n monitoring --version 92.10.1 -f platform/monitoring-values.yaml
# kube-prometheus-stack, kind (local) ke liye halka setup

# kind me ye components 127.0.0.1 pe bind hote hain, scrape fail hota aur galat alerts aate
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false

# kind/WSL2 me node-exporter ka root mount propagation error aata hai
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.localhost
    paths:
      - /
  prometheusSpec:
    retention: 2d
    # sabhi namespaces ke ServiceMonitor/PodMonitor/rules pick karo (release label ke bina)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    additionalScrapeConfigs:
      - job_name: 'node-exporter-local-wsl'
        static_configs:
          - targets: ['172.30.29.78:9100']
grafana:
  # admin password Git me nahi, alag Secret se aata hai (neeche step b)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.localhost
    path: /
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 240
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 20

alertmanager:
  alertmanagerSpec:
    # Slack webhook Secret ko pod me mount karo (/etc/alertmanager/secrets/alertmanager-slack/url)
    secrets:
      - alertmanager-slack
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # heartbeat aur inhibitor alerts kahin nahi jayenge
        - receiver: 'null'
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        # warning aur critical Slack pe
        - receiver: slack-alerts
          matchers:
            - severity =~ "warning|critical"
    receivers:
      - name: 'null'
      - name: slack-alerts
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.severity }}*: {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
