# Installed with: helm upgrade --install traefik traefik/traefik -n traefik --version 39.0.9 -f platform/traefik-values.yaml
# kind: Traefik ko control-plane node pe chalao jahan laptop ka 80/443 mapped hai
nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    effect: NoSchedule

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

# hostPort wale single node pe naya pod tabhi bane jab purana hat jaye
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  type: ClusterIP

# Prometheus metrics Traefik me default on hain. Dedicated Service + ServiceMonitor
# banate hain taaki kube-prometheus-stack unhe scrape kare.
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
